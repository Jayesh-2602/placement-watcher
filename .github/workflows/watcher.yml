name: Placement Watcher

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allows manual trigger from GitHub UI

jobs:
  check-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install playwright python-dotenv requests
          playwright install --with-deps chromium

      - name: Restore seen_messages.db from cache
        uses: actions/cache@v4
        with:
          path: seen_messages.db
          # Use a fixed key so the DB persists across runs.
          # The restore-keys fallback ensures we always get the latest.
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-

      - name: Run watcher
        env:
          PORTAL_MESSAGES_URL: ${{ secrets.PORTAL_MESSAGES_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          HEALTHCHECK_PING_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
          STATE_JSON_B64: ${{ secrets.STATE_JSON_B64 }}
        run: python watch_gha.py
